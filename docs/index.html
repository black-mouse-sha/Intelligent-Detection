<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多参数环境监测与自动化控制平台 · 架构图</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --fg: #16181d; --muted: #62676f;
    --line: #e3e6ea; --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --fg: #e6edf3; --muted: #9198a1;
      --line: #30363d; --accent: #58a6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 56px 24px 72px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 10px; letter-spacing: .5px; }
  .sub { color: var(--muted); margin: 0 0 36px; font-size: 15px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  a.card {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card img {
    display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain;
    background: var(--bg); padding: 10px; border-bottom: 1px solid var(--line);
  }
  .body { padding: 16px 18px 18px; flex: 1; }
  .body strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .body span { color: var(--muted); font-size: 14px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>多参数环境监测与自动化控制平台</h1>
  <p class="sub">Arduino Nano + ESP-01S · 5 类参数在线采集 · OLED 本地显示 · 阈值报警联动 · 手机端远程监控</p>

  <div class="grid">
    <a class="card" href="diagrams/esp-monitor-architecture.html">
      <img src="images/diagrams/architecture.png" alt="系统组成图">
      <div class="body">
        <strong>系统组成</strong>
        <span>传感器阵列 → 主控 → 本地显示与执行器；ESP-01S 单独一支到手机端</span>
      </div>
    </a>
    <a class="card" href="diagrams/esp-monitor-loop.html">
      <img src="images/diagrams/loop.png" alt="主循环流程图">
      <div class="body">
        <strong>主循环流程</strong>
        <span>采集 → 显示 → 判阈 → 报警 → 上报，200ms 一轮</span>
      </div>
    </a>
  </div>

  <footer>
    两张图都可缩放、可切换主题，节点带源码定位 ·
    <a href="https://github.com/black-mouse-sha/Intelligent-Detection">回到仓库</a>
  </footer>
</div>
</body>
</html>
